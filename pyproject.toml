[project]
name = "glens"
version = "0.1.0"
description = "GPCR G-alpha coupling interrogator."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
glens = "glens.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["glens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
